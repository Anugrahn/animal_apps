<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#6C4CF1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Animal Friends</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="core/ui.css">
  <link rel="stylesheet" href="core/screens.css">
  <link rel="stylesheet" href="modules/letters/letters.css">
</head>
<body>

<div class="scenery" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span>
  <span class="blob b3"></span><span class="blob b4"></span>
</div>

<!-- ============ 1. CHARACTER PICKER ============ -->
<main id="pick" class="screen">
  <h1 class="pick-title">Pick your friend</h1>
  <p class="pick-sub">They will play with you the whole way.</p>
  <div class="pick-row" id="pick-row"></div>
</main>

<!-- ============ 2. HOME ============ -->
<main id="home" class="screen">
  <header class="home-top">
    <div class="home-char" id="home-char"></div>
    <div class="speech" id="home-hello"></div>
    <span class="starcount"><span class="s">⭐</span><span id="home-stars">0</span></span>
    <button class="round-btn btn-grown" id="btn-grown" aria-label="For grown-ups">⚙️</button>
  </header>
  <div class="scroll">
    <div class="home-grid" id="home-grid"></div>
  </div>
</main>

<!-- ============ 3. LEVEL MAP ============ -->
<main id="map" class="screen">
  <header class="bar">
    <button class="round-btn" data-home aria-label="Home">🏠</button>
    <div class="map-char" id="map-char"></div>
    <div class="bar-mid">
      <div class="bar-title" id="map-title"></div>
      <span class="bar-note" id="map-note"></span>
    </div>
    <span class="starcount"><span class="s">⭐</span><span id="map-stars">0</span></span>
  </header>
  <div class="scroll">
    <div class="map-wrap"><div class="map-path" id="map-path"></div></div>
  </div>
</main>

<!-- ============ 4. PLAY ============ -->
<main id="play" class="screen">
  <header class="bar">
    <button class="round-btn" id="play-back" aria-label="Back to the map">⬅️</button>
    <div class="bar-mid"><div class="bar-title" id="play-title"></div></div>
    <button class="round-btn" data-home aria-label="Home">🏠</button>
  </header>
  <div class="play-stage" id="play-host"></div>
</main>

<!-- ============ RESULT SHEET ============ -->
<div class="sheet" id="result" hidden>
  <div class="sheet-card result-card">
    <div class="result-char"></div>
    <h2 class="result-title">Level complete!</h2>
    <div class="result-stars" aria-hidden="true"><i>★</i><i>★</i><i>★</i></div>
    <div class="result-btns">
      <button class="btn" data-act="map"><em>🗺️</em> Map</button>
      <button class="btn" data-act="retry"><em>🔄</em> Again</button>
      <button class="btn go" data-act="next">Next <em>▶️</em></button>
    </div>
  </div>
</div>

<!-- ============ GROWN-UP SHEET ============ -->
<div class="sheet" id="grown" hidden>
  <div class="sheet-card">
    <button class="round-btn sheet-close" id="grown-close" aria-label="Close">✖️</button>
    <h2>For grown-ups</h2>

    <div class="grown-rows">
      <button class="sw" data-toggle="sound"><em>🔊</em> Voice &amp; sounds <span class="sw-state"></span></button>
      <button class="sw" data-toggle="motion"><em>✨</em> Confetti &amp; wiggles <span class="sw-state"></span></button>
    </div>

    <div class="grown-meta">
      Friend: <b id="stat-char">—</b><br>
      Stars earned: <b id="stat-stars">0</b><br>
      Voice in use: <b id="voice-name">—</b>
    </div>

    <div class="grown-btns">
      <button class="btn" id="btn-swap"><em>🔁</em> Change friend</button>
      <button class="btn danger" id="btn-reset">Start over</button>
    </div>
  </div>
</div>

<!-- ============ CELEBRATION ============ -->
<div class="party" id="party" aria-live="polite">
  <div>
    <div class="party-char"></div>
    <div class="party-text">Hooray!</div>
    <div class="party-sub" hidden></div>
  </div>
</div>

<div id="fx" aria-hidden="true"></div>

<!-- core -->
<script src="core/art.js"></script>
<script src="core/profile.js"></script>
<script src="core/audio.js"></script>
<script src="core/fx.js"></script>
<script src="core/levels.js"></script>
<!-- modules -->
<script src="modules/registry.js"></script>
<script src="modules/letters/letters.js"></script>
<!-- boot -->
<script src="core/app.js"></script>
</body>
</html>
